name: Deep-inspect GTA SA mod archives

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-archives.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deep-inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Install archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y 7zip 7zip-rar file binutils

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p archives extracted reports
          gh release download v1.0 --repo "${GITHUB_REPOSITORY}" --pattern "*.zip" --dir archives
          ls -lh archives

      - name: Verify and extract release ZIPs
        run: |
          set -euo pipefail
          for archive in archives/*.zip; do
            echo "Testing: $archive"
            7z t "$archive"
            name="$(basename "$archive" .zip)"
            mkdir -p "extracted/$name"
            7z x -y -o"extracted/$name" "$archive"
          done

      - name: Recursively extract nested archives and build inventories
        run: |
          python3 - <<'PY'
          import csv
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess
          import struct
          import zipfile
          from collections import defaultdict, Counter

          BASE = pathlib.Path(".").resolve()
          EXTRACTED = BASE / "extracted"
          NESTED = BASE / "nested-extracted"
          REPORTS = BASE / "reports"
          NESTED.mkdir(exist_ok=True)
          REPORTS.mkdir(exist_ok=True)
          ARCHIVE_EXTS = {".zip", ".rar", ".7z"}
          MAX_DEPTH = 6

          roots = []
          for p in sorted(EXTRACTED.iterdir()):
              if p.is_dir():
                  roots.append((p, p.name, 0))

          nested_status = []
          processed = set()
          index = 0
          cursor = 0

          # Recursively unpack inner ZIP/RAR/7z archives.
          while cursor < len(roots):
              scan_root, origin, depth = roots[cursor]
              cursor += 1
              if depth >= MAX_DEPTH:
                  continue
              for archive in sorted(scan_root.rglob("*")):
                  if not archive.is_file() or archive.suffix.lower() not in ARCHIVE_EXTS:
                      continue
                  key = str(archive.resolve())
                  if key in processed:
                      continue
                  processed.add(key)
                  index += 1
                  digest = hashlib.sha256(key.encode("utf-8")).hexdigest()[:20]
                  outdir = NESTED / f"{index:04d}_{digest}"
                  outdir.mkdir(parents=True, exist_ok=True)

                  test = subprocess.run(
                      ["7z", "t", str(archive)],
                      stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                      text=True, errors="replace"
                  )
                  extract = None
                  if test.returncode == 0:
                      extract = subprocess.run(
                          ["7z", "x", "-y", f"-o{outdir}", str(archive)],
                          stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                          text=True, errors="replace"
                      )
                  success = test.returncode == 0 and extract is not None and extract.returncode == 0
                  extracted_files = sum(1 for p in outdir.rglob("*") if p.is_file()) if success else 0
                  nested_status.append({
                      "origin": origin,
                      "archive_path": str(archive.relative_to(scan_root)),
                      "archive_bytes": archive.stat().st_size,
                      "depth": depth + 1,
                      "test_exit_code": test.returncode,
                      "extract_exit_code": extract.returncode if extract else None,
                      "success": success,
                      "files_extracted": extracted_files,
                      "output": str(outdir.relative_to(BASE)) if success else "",
                      "diagnostic": (test.stdout + (extract.stdout if extract else ""))[-2500:]
                  })
                  if success and extracted_files:
                      roots.append((outdir, origin, depth + 1))

          # Hash every unpacked file and map installed-game target paths.
          manifest = []
          for root, origin, depth in roots:
              for path in sorted(root.rglob("*")):
                  if not path.is_file():
                      continue
                  try:
                      rel = path.relative_to(root).as_posix()
                      h = hashlib.sha256()
                      with path.open("rb") as stream:
                          for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                              h.update(chunk)
                      size = path.stat().st_size
                      lower = rel.lower()
                      marker = "com.rockstargames.gtasa/files/"
                      if marker in lower:
                          target = lower.split(marker, 1)[1]
                      else:
                          sdx_match = re.search(r"(?:^|/)sa_dox/(.*)$", lower)
                          if sdx_match:
                              target = "sa_dox/" + sdx_match.group(1)
                          elif lower.endswith("/2. mod/libsdx.so"):
                              target = "mods/libsdx.so"
                          else:
                              target = lower
                      manifest.append({
                          "source_archive": origin,
                          "extraction_depth": depth,
                          "extraction_root": str(root.relative_to(BASE)),
                          "archive_relative_path": rel,
                          "target_path": target,
                          "filename": path.name,
                          "extension": path.suffix.lower(),
                          "bytes": size,
                          "sha256": h.hexdigest(),
                          "absolute_path": str(path)
                      })
                  except (OSError, PermissionError) as exc:
                      manifest.append({
                          "source_archive": origin, "extraction_depth": depth,
                          "extraction_root": str(root.relative_to(BASE)),
                          "archive_relative_path": str(path), "target_path": "",
                          "filename": path.name, "extension": path.suffix.lower(),
                          "bytes": -1, "sha256": "", "absolute_path": "",
                          "read_error": str(exc)
                      })

          def write_csv(name, rows, fields):
              with (REPORTS / name).open("w", newline="", encoding="utf-8") as f:
                  w = csv.DictWriter(f, fieldnames=fields, extrasaction="ignore")
                  w.writeheader()
                  w.writerows(rows)

          write_csv("all-files-sha256.csv", manifest, [
              "source_archive", "extraction_depth", "extraction_root", "archive_relative_path",
              "target_path", "filename", "extension", "bytes", "sha256", "read_error"
          ])

          by_target = defaultdict(list)
          by_hash = defaultdict(list)
          by_basename = defaultdict(list)
          for row in manifest:
              if row["target_path"]:
                  by_target[row["target_path"]].append(row)
              if row["sha256"]:
                  by_hash[row["sha256"]].append(row)
              by_basename[row["filename"].lower()].append(row)

          conflicts = []
          for target, entries in sorted(by_target.items()):
              if len(entries) < 2:
                  continue
              hashes = sorted({x["sha256"] for x in entries})
              conflicts.append({
                  "target_path": target,
                  "copies": len(entries),
                  "distinct_hashes": len(hashes),
                  "status": "SAME_CONTENT_DUPLICATE" if len(hashes) == 1 else "CONTENT_CONFLICT",
                  "sources_and_hashes": " || ".join(
                      f'{x["source_archive"]}:{x["extraction_root"]}:{x["archive_relative_path"]}:{x["sha256"]}' for x in entries
                  )
              })
          write_csv("target-path-collisions.csv", conflicts,
                    ["target_path", "copies", "distinct_hashes", "status", "sources_and_hashes"])

          duplicates = []
          for sha, entries in sorted(by_hash.items()):
              if len(entries) > 1:
                  duplicates.append({
                      "sha256": sha, "copies": len(entries),
                      "files": " || ".join(f'{x["source_archive"]}:{x["extraction_root"]}:{x["archive_relative_path"]}' for x in entries)
                  })
          write_csv("identical-content-duplicates.csv", duplicates, ["sha256", "copies", "files"])

          basename_collisions = []
          for name, entries in sorted(by_basename.items()):
              if len(entries) > 1:
                  hashes = {x["sha256"] for x in entries}
                  basename_collisions.append({
                      "basename": name, "copies": len(entries),
                      "distinct_hashes": len(hashes),
                      "status": "SAME_CONTENT" if len(hashes) == 1 else "REVIEW_DIFFERENT_CONTENT",
                      "paths": " || ".join(f'{x["source_archive"]}:{x["archive_relative_path"]}' for x in entries)
                  })
          write_csv("same-basename-review.csv", basename_collisions,
                    ["basename", "copies", "distinct_hashes", "status", "paths"])

          native = []
          cleo = []
          for row in manifest:
              ext = row["extension"]
              path = pathlib.Path(row["absolute_path"]) if row["absolute_path"] else None
              if ext == ".so" and path and path.exists():
                  header = path.read_bytes()[:20]
                  elf_class = "unknown"
                  machine = "not ELF / unknown"
                  if len(header) >= 20 and header[:4] == b"\x7fELF":
                      elf_class = {1: "32-bit", 2: "64-bit"}.get(header[4], "unknown")
                      endian = "little" if header[5] == 1 else "big"
                      em = int.from_bytes(header[18:20], endian)
                      machine = {3: "x86", 40: "ARM", 62: "x86_64", 183: "AArch64"}.get(em, f"e_machine={em}")
                  native.append({
                      "library": row["filename"], "source_archive": row["source_archive"],
                      "path": row["archive_relative_path"], "bytes": row["bytes"],
                      "elf_class": elf_class, "architecture": machine, "sha256": row["sha256"]
                  })
              if ext in {".csa", ".csi", ".cleo", ".cs", ".lua"}:
                  cleo.append({k: row[k] for k in [
                      "source_archive", "extraction_root", "archive_relative_path", "extension", "bytes", "sha256"
                  ]})

          write_csv("native-plugins-elf.csv", native,
                    ["library", "source_archive", "path", "bytes", "elf_class", "architecture", "sha256"])
          write_csv("cleo-script-inventory.csv", cleo,
                    ["source_archive", "extraction_root", "archive_relative_path", "extension", "bytes", "sha256"])

          # Dynamic-link dependencies, SONAMEs and embedded version clues.
          native_details = []
          for row in manifest:
              if row["extension"] != ".so" or not row["absolute_path"]:
                  continue
              p = pathlib.Path(row["absolute_path"])
              dyn = subprocess.run(["readelf", "-d", str(p)], stdout=subprocess.PIPE,
                                   stderr=subprocess.STDOUT, text=True, errors="replace")
              dyn_lines = [ln.strip() for ln in dyn.stdout.splitlines()
                           if "NEEDED" in ln or "SONAME" in ln or "RPATH" in ln or "RUNPATH" in ln]
              raw = p.read_bytes()
              embedded = sorted({x.decode("ascii", "ignore") for x in re.findall(rb"[ -~]{5,}", raw)
                                 if re.search(rb"(?i)aml|cleo|sautils|jpatch|version|gtasa|2\\.00|2\\.10|2\\.11", x)})
              native_details.append({
                  "library": row["filename"],
                  "source_archive": row["source_archive"],
                  "path": row["archive_relative_path"],
                  "readelf_exit": dyn.returncode,
                  "dynamic_entries": " || ".join(dyn_lines),
                  "embedded_version_strings": " || ".join(embedded[:80])
              })
          write_csv("native-plugin-dependencies.csv", native_details, [
              "library", "source_archive", "path", "readelf_exit",
              "dynamic_entries", "embedded_version_strings"
          ])

          priority_names = {
              "handling.cfg", "handlingpc.cfg", "ped.ifp", "mainv1.scm",
              "scriptv1.img", "timecyc.dat", "colorcycle.dat", "popcycle.dat",
              "salodlights.dat"
          }
          priority = [x for x in manifest if x["filename"].lower() in priority_names]
          write_csv("priority-file-review.csv", priority,
                    ["source_archive", "archive_relative_path", "target_path", "bytes", "sha256"])

          # Parse GTA SA IMG VER2 directories without rewriting the archives.
          img_rows = []
          img_summary = []
          for row in manifest:
              if row["extension"] != ".img" or not row["absolute_path"]:
                  continue
              p = pathlib.Path(row["absolute_path"])
              try:
                  with p.open("rb") as stream:
                      header = stream.read(8)
                      if len(header) < 8 or header[:4] != b"VER2":
                          img_summary.append({
                              "source_archive": row["source_archive"],
                              "extraction_root": row["extraction_root"],
                              "archive": row["archive_relative_path"],
                              "format": header[:4].decode("ascii", "replace"),
                              "entries": 0,
                              "status": "UNRECOGNIZED_OR_NOT_VER2"
                          })
                          continue
                      count = struct.unpack_from("<I", header, 4)[0]
                      if count > 1000000 or 8 + count * 32 > p.stat().st_size:
                          img_summary.append({
                              "source_archive": row["source_archive"],
                              "extraction_root": row["extraction_root"],
                              "archive": row["archive_relative_path"],
                              "format": "VER2",
                              "entries": count,
                              "status": "INVALID_DIRECTORY_BOUNDS"
                          })
                          continue
                      directory = stream.read(count * 32)
                  seen_names = Counter()
                  parsed = []
                  for idx in range(count):
                      pos = idx * 32
                      sector_offset, streaming_sectors, archive_sectors = struct.unpack_from("<IHH", directory, pos)
                      name_raw = directory[pos + 8:pos + 32].split(b"\x00", 1)[0]
                      name = name_raw.decode("latin-1", "replace")
                      seen_names[name.lower()] += 1
                      parsed.append({
                          "source_archive": row["source_archive"],
                          "extraction_root": row["extraction_root"],
                          "archive": row["archive_relative_path"],
                          "entry_index": idx,
                          "entry_name": name,
                          "sector_offset": sector_offset,
                          "streaming_sectors": streaming_sectors,
                          "archive_sectors": archive_sectors,
                          "duplicate_name_count": 0
                      })
                  for entry in parsed:
                      entry["duplicate_name_count"] = seen_names[entry["entry_name"].lower()]
                      img_rows.append(entry)
                  img_summary.append({
                      "source_archive": row["source_archive"],
                      "extraction_root": row["extraction_root"],
                      "archive": row["archive_relative_path"],
                      "format": "VER2",
                      "entries": count,
                      "duplicate_entry_names": sum(1 for n in seen_names.values() if n > 1),
                      "status": "OK"
                  })
              except OSError as exc:
                  img_summary.append({
                      "source_archive": row["source_archive"],
                      "extraction_root": row["extraction_root"],
                      "archive": row["archive_relative_path"],
                      "format": "READ_ERROR",
                      "entries": 0,
                      "status": str(exc)
                  })
          write_csv("img-archive-inventory.csv", img_rows, [
              "source_archive", "extraction_root", "archive", "entry_index", "entry_name",
              "sector_offset", "streaming_sectors", "archive_sectors", "duplicate_name_count"
          ])
          write_csv("img-archive-summary.csv", img_summary, [
              "source_archive", "extraction_root", "archive", "format", "entries",
              "duplicate_entry_names", "status"
          ])

          # Preserve raw ZIP central-directory details, including duplicate member paths.
          zip_rows = []
          zip_summaries = []
          zip_candidates = set()
          for search_root in [BASE / "archives", EXTRACTED, NESTED]:
              if search_root.exists():
                  zip_candidates.update(x for x in search_root.rglob("*.zip") if x.is_file())
          for zp in sorted(zip_candidates):
              try:
                  with zipfile.ZipFile(zp) as zf:
                      infos = [x for x in zf.infolist() if not x.is_dir()]
                      counts = Counter(x.filename.lower() for x in infos)
                      for info in infos:
                          zip_rows.append({
                              "archive": str(zp.relative_to(BASE)),
                              "member_path": info.filename,
                              "bytes": info.file_size,
                              "compressed_bytes": info.compress_size,
                              "crc32": f"{info.CRC:08x}",
                              "encrypted": bool(info.flag_bits & 1),
                              "duplicate_member_path_count": counts[info.filename.lower()]
                          })
                      zip_summaries.append({
                          "archive": str(zp.relative_to(BASE)),
                          "file_entries": len(infos),
                          "duplicate_member_paths": sum(1 for n in counts.values() if n > 1),
                          "encrypted_entries": sum(1 for x in infos if x.flag_bits & 1),
                          "status": "OK"
                      })
              except Exception as exc:
                  zip_summaries.append({
                      "archive": str(zp.relative_to(BASE)), "file_entries": 0,
                      "duplicate_member_paths": 0, "encrypted_entries": 0,
                      "status": str(exc)
                  })
          write_csv("zip-member-inventory.csv", zip_rows, [
              "archive", "member_path", "bytes", "compressed_bytes", "crc32",
              "encrypted", "duplicate_member_path_count"
          ])
          write_csv("zip-archive-summary.csv", zip_summaries, [
              "archive", "file_entries", "duplicate_member_paths", "encrypted_entries", "status"
          ])

          terms = re.compile(
              r"2\.11\.311|2\.11|CLEO|SAUtils|SA Utils|AMLLA|JPatch|SkyGFX|"
              r"Project2DFX|SA_DOX|DirectX|GTAV|GTA V|Android|armeabi|arm64|"
              r"API.?level|version|dependency|require",
              re.IGNORECASE
          )
          text_exts = {
              ".txt", ".ini", ".cfg", ".dat", ".ide", ".ipl", ".fxt", ".log",
              ".xml", ".json", ".md", ".yml", ".yaml", ".toml", ".properties",
              ".shader", ".glsl", ".fxp", ".zon"
          }
          references = []
          for row in manifest:
              if row["extension"] not in text_exts or not row["absolute_path"]:
                  continue
              p = pathlib.Path(row["absolute_path"])
              try:
                  if p.stat().st_size > 2_000_000:
                      continue
                  content = p.read_text(encoding="utf-8", errors="replace")
                  for line_no, line in enumerate(content.splitlines(), 1):
                      if terms.search(line):
                          references.append({
                              "source_archive": row["source_archive"],
                              "extraction_root": row["extraction_root"],
                              "path": row["archive_relative_path"],
                              "line": line_no,
                              "text": line.strip()[:500]
                          })
              except OSError:
                  pass
          write_csv("text-reference-scan.csv", references,
                    ["source_archive", "extraction_root", "path", "line", "text"])

          # Bundle small human-readable configs/readmes for direct content review.
          bundle = []
          bundle_exts = {".ini", ".cfg", ".txt", ".log", ".fxt", ".shader", ".glsl", ".zon"}
          for row in manifest:
              if row["extension"] not in bundle_exts or not row["absolute_path"]:
                  continue
              p = pathlib.Path(row["absolute_path"])
              try:
                  if p.stat().st_size > 150_000:
                      continue
                  body = p.read_text(encoding="utf-8", errors="replace")
                  bundle.append((row["source_archive"], row["archive_relative_path"], body))
              except OSError:
                  pass
          with (REPORTS / "readable-configs-and-notes.txt").open("w", encoding="utf-8") as f:
              for origin, rel, body in bundle:
                  f.write("\\n" + "=" * 100 + "\\n")
                  f.write(f"SOURCE: {origin} | FILE: {rel}\\n")
                  f.write("=" * 100 + "\\n")
                  f.write(body[:150_000] + "\\n")

          # Extract readable embedded strings from compiled CLEO scripts.
          with (REPORTS / "cleo-readable-strings.txt").open("w", encoding="utf-8") as f:
              for row in manifest:
                  if row["extension"] not in {".csa", ".csi", ".cleo", ".cs", ".lua"} or not row["absolute_path"]:
                      continue
                  raw = pathlib.Path(row["absolute_path"]).read_bytes()
                  strings_found = re.findall(rb"[ -~]{4,}", raw)
                  if strings_found:
                      f.write("\\n" + "=" * 100 + "\\n")
                      f.write(f'SOURCE: {row["source_archive"]} | FILE: {row["archive_relative_path"]}\\n')
                      f.write("=" * 100 + "\\n")
                      f.write("\\n".join(x.decode("ascii", "replace") for x in strings_found[:2000]))
                      f.write("\\n")

          write_csv("nested-archive-report.csv", nested_status, [
              "origin", "archive_path", "archive_bytes", "depth", "test_exit_code",
              "extract_exit_code", "success", "files_extracted", "output", "diagnostic"
          ])
          ext_counts = Counter(x["extension"] or "[no extension]" for x in manifest)
          summary = {
              "scan_roots": [{"path": str(p.relative_to(BASE)), "origin": o, "depth": d} for p, o, d in roots],
              "total_files_including_nested_archives": len(manifest),
              "total_bytes": sum(max(0, x["bytes"]) for x in manifest),
              "extensions": dict(sorted(ext_counts.items())),
              "nested_archives_found": len(nested_status),
              "nested_archives_successfully_extracted": sum(1 for x in nested_status if x["success"]),
              "nested_archive_failures": [x for x in nested_status if not x["success"]],
              "native_plugin_count": len(native),
              "cleo_script_count": len(cleo),
              "target_path_collisions": len(conflicts),
              "different_content_conflicts": sum(1 for x in conflicts if x["status"] == "CONTENT_CONFLICT"),
              "identical_sha256_duplicate_groups": len(duplicates),
              "text_reference_matches": len(references),
              "img_archives": len(img_summary),
              "img_directory_entries": len(img_rows),
              "zip_archives": len(zip_summaries),
              "zip_duplicate_member_paths": sum(x.get("duplicate_member_paths", 0) for x in zip_summaries)
          }
          (REPORTS / "summary.json").write_text(json.dumps(summary, indent=2), encoding="utf-8")
          summary_md = [
              "# GTA SA archive deep-inspection",
              f'- Files indexed (including nested archives): **{len(manifest)}**',
              f'- Nested archives: **{len(nested_status)} found**, **{summary["nested_archives_successfully_extracted"]} extracted successfully**',
              f'- Native .so libraries: **{len(native)}**',
              f'- CLEO script files (.csa/.csi/.cleo/.cs/.lua): **{len(cleo)}**',
              f'- Target-path collisions: **{len(conflicts)}** (**{summary["different_content_conflicts"]} different-content conflicts**)',
              f'- IMG archives indexed: **{len(img_summary)}** (**{len(img_rows)} internal entries**)',
              f'- ZIP archives checked: **{len(zip_summaries)}** (**{summary["zip_duplicate_member_paths"]} duplicate member paths**)',
              "",
              "See the uploaded artifact for full CSV/JSON reports. A filename/path collision is not automatically proof of runtime incompatibility; compare contents and test on game build 2.11.311."
          ]
          pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(summary_md) + "\n")
          print(json.dumps(summary, indent=2))
          PY

      - name: Assemble VUltraRealism Mod for AML GTA SA 2.00 (32-bit)
        run: |
          python3 - <<'PY'
          import csv
          import hashlib
          import pathlib
          import shutil
          import zipfile

          base = pathlib.Path(".").resolve()
          v8_roots = list((base / "extracted").rglob("com.rockstargames.gtasa"))
          v8_roots = [p for p in v8_roots
                      if p.parent.name == "GTA V Project Modpack V8"
                      and (p / "mods").is_dir() and (p / "files").is_dir()]
          if len(v8_roots) != 1:
              raise SystemExit(f"Expected one V8 game-data root, got: {v8_roots}")
          v8 = v8_roots[0]

          # Locate the standalone Saadox Ultra preset by its distinctive 75% render scale.
          ultra_candidates = []
          for ini in (base / "nested-extracted").rglob("SA_DOX/Advanced.ini"):
              try:
                  text = ini.read_text(encoding="utf-8", errors="replace")
              except OSError:
                  continue
              if ini.parent.parent.name == "4. Preset Ultra" and "iResolutionScale = 75" in text:
                  ultra_candidates.append(ini.parent)
          if len(ultra_candidates) != 1:
              raise SystemExit(f"Expected one standalone Saadox Ultra SA_DOX folder, got: {ultra_candidates}")
          ultra = ultra_candidates[0]

          # Use the standalone Saadox libSDX, not V8's optional legacy copy.
          sdx_candidates = []
          for scan_root, origin, depth in roots:
              if origin.startswith("sabox-2-0-in-directx"):
                  candidate = scan_root / "SA DOX 2.0" / "2. Mod" / "libSDX.so"
                  if candidate.is_file():
                      sdx_candidates.append(candidate)
          if len(sdx_candidates) != 1:
              raise SystemExit(f"Expected one standalone Saadox libSDX.so, got: {sdx_candidates}")

          out = base / "dist"
          root = out / "VUltraRealism Mod"
          game = root / "Android" / "data" / "com.rockstargames.gtasa"
          files_out = game / "files"
          mods_out = game / "mods"
          configs_out = game / "configs"
          disabled_out = root / "OPTIONAL - Disabled SA_DOX Conflicts" / "mods"
          for d in [files_out, mods_out, configs_out, disabled_out]:
              d.mkdir(parents=True, exist_ok=True)

          # Install the full V8 game-file overlay, but never its optional SA_DOX fork.
          shutil.copytree(v8 / "files", files_out, dirs_exist_ok=True)

          # Explicitly remove any V8 SA_DOX directory if it exists in the base files tree.
          v8_sadox = files_out / "SA_DOX"
          if v8_sadox.exists():
              shutil.rmtree(v8_sadox)

          # Apply the complete standalone Ultra preset.
          shutil.copytree(ultra, files_out / "SA_DOX", dirs_exist_ok=True)

          # GTA V-style main menu texture database from V8's optional menu pack.
          menu_candidates = list((base / "extracted").rglob("Menu GTA V Style/Android_unprotected/data/com.rockstargames.gtasa/files/texdb/menu"))
          if len(menu_candidates) != 1:
              raise SystemExit(f"Expected one GTA V-style menu asset directory, got: {menu_candidates}")
          shutil.copytree(menu_candidates[0], files_out / "texdb" / "menu", dirs_exist_ok=True)

          # Retain V8 CLEO scripts and their text resources. Do not include logs or save/settings files.
          cleo_exts = {".csa", ".csi", ".fxt"}
          cleo_files = [p for p in v8.iterdir() if p.is_file() and p.suffix.lower() in cleo_exts]
          if len([p for p in cleo_files if p.suffix.lower() in {".csa", ".csi"}]) != 25:
              raise SystemExit("CLEO source set did not contain the expected 25 .csa/.csi scripts")
          for p in cleo_files:
              shutil.copy2(p, game / p.name)

          # Plugins documented as incompatible with SA_DOX are preserved separately,
          # but intentionally not placed in the active mods directory.
          disabled = {
              "libGPS.so",
              "libMoreSettings.so",
              "libProject2DFX.so",
              "libSAPlanter.so",
              "libSkyGFXMobile.so",
          }
          active_plugins = []
          for p in sorted((v8 / "mods").glob("*.so")):
              if p.name in disabled:
                  shutil.copy2(p, disabled_out / p.name)
              else:
                  shutil.copy2(p, mods_out / p.name)
                  active_plugins.append(p.name)
          shutil.copy2(sdx_candidates[0], mods_out / "libSDX.so")

          # Copy the V8 configs except configs belonging to disabled plugins.
          disabled_config_names = {
              "net.dk22pac.rusjj.gps.ini",
              "net.rusjj.gtasa.moresettings.ini",
              "SkyGFXMobile.ini",
          }
          for p in sorted((v8 / "configs").glob("*")):
              if not p.is_file() or p.name in disabled_config_names:
                  continue
              shutil.copy2(p, configs_out / p.name)

          # Use V8's main Busy traffic popcycle; it was verified byte-identical to its Busy preset.
          busy = list((base / "extracted").rglob("Busy traffic cheat/Android_unprotected/data/com.rockstargames.gtasa/files/data/popcycle.dat"))
          if len(busy) != 1:
              raise SystemExit(f"Expected one Busy traffic popcycle.dat, got: {busy}")
          shutil.copy2(busy[0], files_out / "data" / "popcycle.dat")

          # Preserve excluded plugin binaries and tell the user why they are not active.
          disabled_note = root / "OPTIONAL - Disabled SA_DOX Conflicts" / "README.txt"
          disabled_note.write_text(
              "These original V8 plugin binaries are intentionally NOT installed in the active mods folder "
              "because the Saadox Android compatibility guide lists them as incompatible with SA_DOX 2.0:\\n"
              + "\\n".join(sorted(disabled))
              + "\\nKeep them here as backups; do not move them to Android/data/com.rockstargames.gtasa/mods "
              "while using SA_DOX.\\n",
              encoding="utf-8"
          )

          # Build precise package inventory and SHA-256 manifest.
          manifest = []
          for p in sorted(root.rglob("*")):
              if not p.is_file():
                  continue
              rel = p.relative_to(root).as_posix()
              h = hashlib.sha256(p.read_bytes()).hexdigest()
              manifest.append((rel, p.stat().st_size, h))
          with (root / "MANIFEST-SHA256.csv").open("w", newline="", encoding="utf-8") as f:
              w = csv.writer(f)
              w.writerow(["path", "bytes", "sha256"])
              w.writerows(manifest)

          readme = """VULTRAREALISM MOD
          Personal-use merged data package for GTA San Andreas Android AML 2.00 (32-bit ARM / armeabi-v7a).

          IMPORTANT COMPATIBILITY
          - Target: GTA SA Android 2.00 32-bit ARM with the matching AML 2.00 APK/runtime.
          - Do NOT use with GTA SA 2.10 64-bit or 2.11.311 arm64-v8a.
          - POCO F6 WARNING: its Snapdragon 8s Gen 3 uses A64-only Cortex-X4/A720/A520 cores. A 32-bit game needs a compatible system translation layer. Before installing, run "getprop ro.product.cpu.abilist" in Termux. If the output does not contain "armeabi-v7a", this package cannot run on that ROM; stop here. Do not try random APK variants or change OBB files to bypass this.
          - No APK, game OBB, Rockstar game assets outside the uploaded mod sources, or paid game files are included.
          - Installation has not been tested on a live phone. Back up your game data and saves first.

          INCLUDED
          - V8 game files/data overlay.
          - All 25 V8 CLEO scripts (.csa/.csi) and their .fxt text files.
          - V8 AML plugin set excluding the five plugins listed below.
          - SAUtils, AML Limit Adjuster and JPatch are retained.
          - Standalone Saadox 2.0 DX3 Ultra preset and its libSDX.so.
          - GTA V-style menu texture database.
          - Busy traffic popcycle.dat.
          - Disabled original plugin backups (kept outside the active mods folder).

          WHY FIVE PLUGINS ARE DISABLED
          The Saadox Android compatibility guide lists these as incompatible with SA_DOX:
          libGPS.so, libMoreSettings.so, libProject2DFX.so, libSAPlanter.so, libSkyGFXMobile.so.
          Their .so files are preserved in OPTIONAL - Disabled SA_DOX Conflicts/mods/.
          Do not copy those backups into the active mods folder while SA_DOX is enabled.

          INSTALL WITH ZARCHIVER
          1. Install a legitimate, matching GTA SA Android 2.00 AML APK for 32-bit ARM (armeabi-v7a).
             Do not use the current 2.11.311 Play Store build. Do not mix APK/OBB from different builds.
          2. Put the matching original game OBB files in:
             /storage/emulated/0/Android/obb/com.rockstargames.gtasa/
             Keep their original filenames. For the classic 2.00 package, community reports commonly show
             main.8.com.rockstargames.gtasa.obb and patch.8.com.rockstargames.gtasa.obb; use the exact
             files supplied with your own legitimate 2.00 installation/backup, not renamed files.
          3. Launch the game once, wait for it to reach the main menu, then close it completely.
          4. In ZArchiver, open this ZIP and enter its VUltraRealism Mod folder.
          5. Open the Android folder inside it. Copy the data folder to phone storage /Android/.
             The final destination must be:
             /storage/emulated/0/Android/data/com.rockstargames.gtasa/
             Merge with the existing package folder and choose overwrite/replace for mod files when prompted.
             Do not delete the whole Android/data/com.rockstargames.gtasa folder.
          6. Confirm the final paths include:
             Android/data/com.rockstargames.gtasa/mods/
             Android/data/com.rockstargames.gtasa/configs/
             Android/data/com.rockstargames.gtasa/files/SA_DOX/
             Android/data/com.rockstargames.gtasa/GTA V Hud.csa
          7. Launch the game. Give the first load extra time. Check SA_DOX log/config files if the graphics
             renderer does not initialize. If the game crashes, restore the backup before removing plugins.

          ANDROID 13-16 / ZARCHIVER ACCESS
          ZArchiver needs storage permission. For Android/data, use its system folder picker and grant the
          requested folder access when Android allows it. On some recent security-patch builds Android blocks
          direct third-party file-manager access; in that case use Shizuku with ZArchiver, or copy the folder
          using a PC/USB file transfer. Do not repeatedly delete app data to work around permission errors.

          PERFORMANCE
          Ultra is the maximum-quality preset, not a guaranteed 60/90/100 FPS profile. If the phone overheats,
          stutters, or crashes, switch to Saadox High by replacing the entire SA_DOX folder with the High preset
          from the original Saadox archive. Never mix files between presets.

          OBB NOTE
          This mod ZIP does not contain or replace game OBB files. The OBB supplies the original game assets;
          this package is an Android/data overlay plus AML mods/configs.
          """
          (root / "README-FIRST.txt").write_text(readme, encoding="utf-8")

          # Rebuild manifest so it also contains the README.
          manifest = []
          for p in sorted(root.rglob("*")):
              if p.is_file() and p.name != "MANIFEST-SHA256.csv":
                  rel = p.relative_to(root).as_posix()
                  h = hashlib.sha256(p.read_bytes()).hexdigest()
                  manifest.append((rel, p.stat().st_size, h))
          with (root / "MANIFEST-SHA256.csv").open("w", newline="", encoding="utf-8") as f:
              w = csv.writer(f)
              w.writerow(["path", "bytes", "sha256"])
              w.writerows(manifest)

          archive = out / "VUltraRealism Mod.zip"
          if archive.exists():
              archive.unlink()
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=1, allowZip64=True) as zf:
              for p in sorted(root.rglob("*")):
                  if p.is_file():
                      zf.write(p, p.relative_to(out).as_posix())
          # Structural verification and test each member CRC.
          with zipfile.ZipFile(archive, "r") as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f"ZIP CRC verification failed at {bad}")
              names = zf.namelist()
              if not any(x.endswith("/files/SA_DOX/Advanced.ini") for x in names):
                  raise SystemExit("Ultra SA_DOX preset missing from final ZIP")
              if not any(x.endswith("/mods/libSDX.so") for x in names):
                  raise SystemExit("libSDX.so missing from active mods directory")
              if sum(1 for x in names if x.lower().endswith((".csa", ".csi"))) != 25:
                  raise SystemExit("Expected exactly 25 CLEO scripts in final ZIP")
          print(f"PACKAGE={archive}")
          print(f"PACKAGE_BYTES={archive.stat().st_size}")
          print(f"PACKAGE_FILES={len(manifest)}")
          print(f"ACTIVE_V8_PLUGINS={len(active_plugins)}")
          print("ACTIVE_V8_PLUGIN_NAMES=" + ",".join(active_plugins))
          print(f"CLEO_SCRIPTS={len(cleo_files)}")
          print("ULTRA_PRESET=" + str(ultra))
          print("SA_DOX_LIB=" + str(sdx_candidates[0]))
          PY

      - name: Upload deep-inspection reports
        uses: actions/upload-artifact@v4
        with:
          name: gta-sa-deep-inspection-${{ github.run_number }}
          path: |
            reports/
            dist/VUltraRealism Mod.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
